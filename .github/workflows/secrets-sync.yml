name: Sync Worker secrets

# Manual only. Pushes the app's runtime secrets from GitHub Actions secrets into
# Cloudflare Worker secrets, so `wrangler deploy` never has to carry them.
#
# Run this once after the first deploy, and again whenever a key rotates.
# Secrets you have not set in GitHub are skipped, never blanked. To delete one,
# use `wrangler secret delete NAME`.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Push secrets to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Built with node (not shell) so no secret value is ever interpolated
      # into a command line or echoed to the log.
      - name: Push secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          node -e '
            const keys = [
              "ANTHROPIC_API_KEY",
              "RESEND_API_KEY",
              "EMAIL_FROM",
              "EMAIL_TO",
              "OPENAI_API_KEY",
              "LINKEDIN_CLIENT_ID",
              "LINKEDIN_CLIENT_SECRET",
              "LINKEDIN_ACCESS_TOKEN",
              "LINKEDIN_AUTHOR_URN",
            ];
            const payload = {};
            for (const key of keys) {
              if (process.env[key]) payload[key] = process.env[key];
            }
            if (Object.keys(payload).length === 0) {
              console.error("No secrets are set in this repository — nothing to sync.");
              process.exit(1);
            }
            console.error("Syncing: " + Object.keys(payload).join(", "));
            process.stdout.write(JSON.stringify(payload));
          ' | npx wrangler secret bulk
