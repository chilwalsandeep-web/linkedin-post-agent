name: Deploy

# Auto-deploys to Cloudflare Workers on every push to main.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#
# Optional repository variable:
#   DEPLOY_URL             - public Worker URL; if set, /health is checked after deploy
#
# App secrets (ANTHROPIC_API_KEY, LINKEDIN_CLIENT_SECRET, ...) are Worker
# secrets, not build-time values — push them with the "Sync Worker secrets"
# workflow or `wrangler secret put`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Worker bundle
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check /health
        if: vars.DEPLOY_URL != ''
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "${{ vars.DEPLOY_URL }}/health" | grep -q '"ok":true'; then
              echo "Deployment is healthy."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::/health did not return ok after the deploy."
          exit 1
